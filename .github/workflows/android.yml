name: Android app

# Builds the Daily Missions Android app and runs its unit tests.
# The build is unsigned: it is signed outside GitHub with the private key
# (python3 build/build_apk.py --shell build/shell/app-release-unsigned.apk ...),
# so the key never has to be stored here.

on:
  push:
    paths:
      - 'android/**'
      - 'Daily_Missions.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        run: gradle -p android testReleaseUnitTest --no-daemon --stacktrace

      - name: Build unsigned release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: daily-missions-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Commit the unsigned build for signing
        run: |
          mkdir -p build/shell
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk build/shell/app-release-unsigned.apk
          sha256sum Daily_Missions.html | cut -d' ' -f1 > build/shell/planner.sha256
          echo "${GITHUB_SHA}" > build/shell/source-commit.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/shell
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Unsigned Android build of ${GITHUB_SHA::7}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
